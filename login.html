<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン - プロジェクトアーカイブ</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <button class="hamburger" aria-label="メニューを開く">
    <span></span><span></span><span></span>
  </button>

  <div class="page-wrapper">
    <aside class="sidebar" data-nav-level="root"></aside>

    <main class="main-content">
      <header class="doc-header">
        <div class="doc-category">AUTH</div>
        <h1 class="doc-title">ログイン</h1>
        <div class="doc-meta">
          <span><span class="material-symbols-outlined icon-sm">lock</span> セッション認証</span>
          <span><span class="material-symbols-outlined icon-sm">api</span> POST /api/auth/login</span>
        </div>
      </header>

      <div class="doc-body">
        <section class="section">
          <h2 class="section-title"><span class="section-icon"><span class="material-symbols-outlined">person</span></span> アカウント情報</h2>
          <form id="login-form" class="contact-form" novalidate>
            <div class="form-group">
              <label for="email">メールアドレス</label>
              <input id="email" name="email" type="email" autocomplete="email" required placeholder="name@example.com">
            </div>
            <div class="form-group">
              <label for="password">パスワード</label>
              <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="パスワードを入力">
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn-primary" id="login-submit">ログイン</button>
            </div>
          </form>
          <div id="login-message" class="fill-hint" style="margin-top:10px;"></div>
          <div id="login-response" class="fill-content" style="display:none; margin-top:10px;">
            <pre id="login-response-json" style="white-space:pre-wrap; word-break:break-word;"></pre>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
